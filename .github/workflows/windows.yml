name: Windows x64
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) {
            choco install innosetup --version=6.4.3 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (!(Test-Path $compiler)) { throw "Inno Setup compiler not found" }
          "ISCC=$compiler" >> $env:GITHUB_ENV
      - name: Configure public Telegram endpoint
        shell: pwsh
        env:
          SHADOW_SUPABASE_URL: ${{ vars.SHADOW_SUPABASE_URL }}
          SHADOW_SUPABASE_KEY: ${{ vars.SHADOW_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if ($env:SHADOW_SUPABASE_URL -or $env:SHADOW_SUPABASE_KEY) {
            if ($env:SHADOW_SUPABASE_URL -notmatch '^https://[a-z0-9]+\.supabase\.co/?$' -or
                $env:SHADOW_SUPABASE_KEY -notmatch '^sb_publishable_[a-zA-Z0-9_-]+$') {
              throw "Expected hosted Supabase URL and a publishable key"
            }
            @{url=$env:SHADOW_SUPABASE_URL; publishable_key=$env:SHADOW_SUPABASE_KEY} |
              ConvertTo-Json | Set-Content shadowafk/ui/telegram-config.json -Encoding utf8
          }
      - name: Build and test
        shell: cmd
        run: build.bat
      - name: Verify installation
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP "Shadow AFK Test"
          $process = Start-Process release/ShadowAFK_Setup.exe -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$destination`"" -PassThru -Wait
          if ($process.ExitCode) { throw "Installer exit code $($process.ExitCode)" }
          $app = Start-Process "$destination/ShadowAFK.exe" -ArgumentList "--smoke" -PassThru -Wait
          if ($app.ExitCode) { throw "Installed application exit code $($app.ExitCode)" }
          $uninstall = Start-Process "$destination/unins000.exe" -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -PassThru -Wait
          if ($uninstall.ExitCode) { throw "Uninstaller exit code $($uninstall.ExitCode)" }
      - name: Archive portable distribution
        shell: pwsh
        run: Compress-Archive -Path dist/ShadowAFK -DestinationPath release/ShadowAFK_Portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ShadowAFK-Windows-x64
          path: release/
          if-no-files-found: error
