name: Windows x64
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
      - name: Install Inno Setup
        run: choco install innosetup --version=6.4.3 --yes --no-progress
      - name: Build and test
        shell: cmd
        run: build.bat
      - name: Verify installation
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP "Shadow AFK Test"
          $process = Start-Process release/ShadowAFK_Setup.exe -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$destination`"" -PassThru -Wait
          if ($process.ExitCode) { throw "Installer exit code $($process.ExitCode)" }
          $app = Start-Process "$destination/ShadowAFK.exe" -ArgumentList "--smoke" -PassThru -Wait
          if ($app.ExitCode) { throw "Installed application exit code $($app.ExitCode)" }
          $uninstall = Start-Process "$destination/unins000.exe" -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -PassThru -Wait
          if ($uninstall.ExitCode) { throw "Uninstaller exit code $($uninstall.ExitCode)" }
      - name: Archive portable distribution
        shell: pwsh
        run: Compress-Archive -Path dist/ShadowAFK -DestinationPath release/ShadowAFK_Portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ShadowAFK-Windows-x64
          path: release/
          if-no-files-found: error
